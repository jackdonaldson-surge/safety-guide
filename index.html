<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Safety Guide</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: #0f172a;
      min-height: 100vh;
    }
    /* Center the trigger button */
    .glossary-trigger {
      position: fixed !important;
      left: 50% !important;
      bottom: 50% !important;
      transform: translate(-50%, 50%) !important;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/gh/jackdonaldson-surge/safety-glossary@5a9c7cc/ultimate-safety-guide.js"></script>
  <script>
    // Auto-click the trigger button once it loads
    const waitForTrigger = setInterval(() => {
      const trigger = document.getElementById('glossary-trigger');
      if (trigger) {
        clearInterval(waitForTrigger);
        // Small delay to ensure everything is ready
        setTimeout(() => trigger.click(), 200);
      }
    }, 100);
  </script>
</body>
</html>
