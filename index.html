<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Safety Guide</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; background: #0f172a; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/gh/jackdonaldson-surge/safety-glossary@main/ultimate-safety-guide.js"></script>
  <script>
    // Wait for widget to load, then configure for standalone mode
    const checkAndOpen = setInterval(() => {
      const trigger = document.getElementById('glossary-trigger');
      const modal = document.getElementById('glossary-modal');
      const overlay = document.getElementById('glossary-overlay');
      const closeBtn = document.getElementById('glossary-close');

      if (trigger && modal && overlay) {
        // Hide trigger button
        trigger.style.display = 'none';

        // Hide close button (no way to close in standalone mode)
        if (closeBtn) closeBtn.style.display = 'none';

        // Make modal fullscreen
        modal.style.width = '95vw';
        modal.style.maxWidth = '900px';
        modal.style.height = '90vh';
        modal.style.maxHeight = 'none';

        // Open modal
        modal.classList.add('open');
        overlay.classList.add('open');

        // Prevent closing
        overlay.onclick = null;

        clearInterval(checkAndOpen);
      }
    }, 100);
  </script>
</body>
</html>
